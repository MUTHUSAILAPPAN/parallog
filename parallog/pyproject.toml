[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallog"
version = "0.1.0"
description = "A map-reduce based Python package for parallel and distributed log analytics."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Muthu"}]
dependencies = []

[project.optional-dependencies]
distributed = ["flask>=2.0", "requests>=2.25"]
benchmark = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]

[project.scripts]
parallog = "parallog.cli:main"

[tool.setuptools.packages.find]
include = ["parallog*"]

[tool.setuptools.package-data]
parallog = ["dashboard.html"]
